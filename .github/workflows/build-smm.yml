name: Build CoHero + SMM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoHero source
        uses: actions/checkout@v4
        with:
          path: cohero

      - name: Checkout Shattered Master Mode
        uses: actions/checkout@v4
        with:
          repository: edward9s/Shattered-Master-Mode
          path: mod

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          SPD_TAG=$(gh api repos/00-Evan/shattered-pixel-dungeon/releases/latest --jq '.tag_name // empty')
          if [ -z "$SPD_TAG" ]; then
            echo "::error::Unable to resolve the latest SPD release tag."
            exit 1
          fi

          SMM_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          if [ -z "$SMM_VER" ]; then
            echo "::error::Unable to resolve the SMM version."
            exit 1
          fi

          COHERO_VER=$(python cohero/scripts/extract_version.py \
            cohero/core/src/main/java/com/spd/cohero/CoHeroVersion.java)
          if [ -z "$COHERO_VER" ]; then
            echo "::error::Unable to resolve the CoHero version."
            exit 1
          fi

          echo "spd_tag=$SPD_TAG" >> "$GITHUB_OUTPUT"
          echo "smm_ver=$SMM_VER" >> "$GITHUB_OUTPUT"
          echo "cohero_ver=$COHERO_VER" >> "$GITHUB_OUTPUT"
          echo "Using CoHero $COHERO_VER with SPD $SPD_TAG and SMM m$SMM_VER"

      - name: Checkout Shattered Pixel Dungeon
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ steps.versions.outputs.spd_tag }}
          path: spd_src

      - name: Verify CoHero source isolation
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/verify_source_layout.py cohero

      - name: Overlay CoHero source
        shell: bash
        run: |
          set -euo pipefail
          cp -a cohero/core/. spd_src/core/

      - name: Patch CoHero integration seams
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/patch_app_package.py spd_src/build.gradle
          python cohero/scripts/patch_gamescene.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java
          python cohero/scripts/patch_cohero_visual_fov.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/tiles/FogOfWar.java
          python cohero/scripts/patch_hero_transition.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java
          python cohero/scripts/patch_cohero_class_traits.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/Char.java
          python cohero/scripts/patch_cohero_ring_traits.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/rings/RingOfArcana.java
          python cohero/scripts/patch_equipment_identification.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/Weapon.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/armor/Armor.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/rings/Ring.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java
          python cohero/scripts/patch_hero_select.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java
          python cohero/scripts/patch_dungeon_save.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Dungeon.java
          python cohero/scripts/patch_games_in_progress.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/GamesInProgress.java
          python cohero/scripts/patch_start_scene.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/StartScene.java
          python cohero/scripts/patch_version_ui.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/TitleScene.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/ui/MenuPane.java
          python cohero/scripts/patch_level_mobs.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java
          python cohero/scripts/patch_mob_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/GreatCrab.java
          python cohero/scripts/patch_prison_boss_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/PrisonBossLevel.java
          python cohero/scripts/patch_locked_floor_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/buffs/LockedFloor.java
          python cohero/scripts/patch_chasm_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/features/Chasm.java
          python cohero/scripts/patch_highgrass.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/features/HighGrass.java
          python cohero/scripts/patch_dread_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/buffs/Dread.java
          python cohero/scripts/patch_delayed_rockfall.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/DelayedRockFall.java
          python cohero/scripts/patch_vault_firewall.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/quest/vault/VaultBossElemental.java
          python cohero/scripts/patch_missileweapon.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/missiles/MissileWeapon.java
          python cohero/scripts/patch_special_weapons.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/melee/MagesStaff.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/SpiritBow.java
          python cohero/scripts/patch_wands.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/Wand.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/DamageWand.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfMagicMissile.java
          python cohero/scripts/patch_blastwave_cohero.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfBlastWave.java
          python cohero/scripts/patch_living_earth.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfLivingEarth.java
          python cohero/scripts/patch_elemental_blast_living_earth.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/abilities/mage/ElementalBlast.java
          python cohero/scripts/patch_cohero_wand_types.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfFrost.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfDisintegration.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfLightning.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfPrismaticLight.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfRegrowth.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfTransfusion.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfCorruption.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfCorrosion.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfFireblast.java \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/wands/WandOfWarding.java

      - name: Patch and merge SMM
        shell: bash
        run: |
          set -euo pipefail

          python mod/scripts/rebase_source.py spd_src mod
          python mod/scripts/patch_android.py spd_src
          python mod/scripts/inject_mod.py spd_src

          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true

          python mod/scripts/patch_depth.py 26

      - name: Patch CoHero-SMM interaction
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/patch_wndgame.py \
            spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          python cohero/scripts/patch_smm_longpress.py \
            spd_src/core/src/main/java/com/spd/mod/mechanics/ModAssassinate.java

      - name: Patch CoHero messages
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/patch_messages.py \
            spd_src/core/src/main/assets/messages/misc \
            cohero/messages

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and JAR
        working-directory: spd_src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :android:assembleRelease :desktop:release

      - name: Install Android build tools for signer
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find spd_src/desktop/build/libs -maxdepth 1 -type f -name '*.jar' | head -1)
          test -n "$JAR" -a -f "$JAR"

          BASE_NAME="CoHero-v${{ steps.versions.outputs.cohero_ver }}-SPD-${{ steps.versions.outputs.spd_tag }}-SMM-m${{ steps.versions.outputs.smm_ver }}"
          mkdir -p out
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "out/${BASE_NAME}.apk"
          cp "$JAR" "out/${BASE_NAME}.jar"

          echo "BASE_NAME=$BASE_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: ${{ env.BASE_NAME }}-APK
          path: out/${{ env.BASE_NAME }}.apk
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: ${{ env.BASE_NAME }}-JAR
          path: out/${{ env.BASE_NAME }}.jar
          if-no-files-found: error
