name: Build CoHero

on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml]

permissions:
  actions: write

jobs:
  remove-maintenance-run:
    if: github.repository == 'edward9s/CoHero-Pixel-Dungeon'
    runs-on: ubuntu-latest
    steps:
      - name: Remove completed maintenance run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == main ]]
          IFS=$'\t' read -r workflow path branch status < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/35870047270" --jq '[.workflow_id, .path, .head_branch, .status] | @tsv')
          [[ "$workflow" == 360314697 && "$path" == .github/workflows/build.yml && "$branch" == maintenance/remove-obsolete-workflows-20260923 && "$status" == completed ]]
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/35870047270"
          echo "deleted 35870047270"
