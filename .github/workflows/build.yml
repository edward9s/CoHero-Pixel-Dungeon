name: Build CoHero

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoHero source
        uses: actions/checkout@v4
        with:
          path: cohero

      - name: Resolve latest Shattered Pixel Dungeon release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/00-Evan/shattered-pixel-dungeon/releases/latest \
            | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using SPD $TAG"

      - name: Checkout Shattered Pixel Dungeon
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ steps.upstream.outputs.tag }}
          path: spd

      - name: Verify CoHero source isolation
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/verify_source_layout.py cohero

      - name: Overlay CoHero source
        shell: bash
        run: |
          set -euo pipefail
          cp -a cohero/core/. spd/core/

      - name: Patch CoHero integration seams
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/patch_app_package.py spd/build.gradle
          python cohero/scripts/patch_gamescene.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java
          python cohero/scripts/patch_hero_sprite.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/HeroSprite.java
          python cohero/scripts/patch_hero_transition.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java
          python cohero/scripts/patch_hero_select.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java
          python cohero/scripts/patch_dungeon_save.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Dungeon.java
          python cohero/scripts/patch_item_context.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/Item.java
          python cohero/scripts/patch_wndbag_owner.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndBag.java
          python cohero/scripts/patch_wnduseitem_owner.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndUseItem.java
          python cohero/scripts/patch_level_companion_chasm.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java
          python cohero/scripts/patch_mob_companion_target.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java
          python cohero/scripts/patch_mob_exp.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java
          python cohero/scripts/patch_shared_strength.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/potions/PotionOfStrength.java \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/potions/elixirs/ElixirOfMight.java
          python cohero/scripts/patch_consumable_owners.py \
            spd/core/src/main/java
          python cohero/scripts/verify_consumable_owners.py \
            spd/core/src/main/java
          python cohero/scripts/patch_wndgame.py \
            spd/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java

      - name: Patch CoHero messages
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/patch_messages.py \
            spd/core/src/main/assets/messages/misc \
            cohero/messages

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and JAR
        working-directory: spd
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :android:assembleRelease :desktop:release

      - name: Determine artifact names
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find spd/android/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          JAR=$(find spd/desktop/build/libs -maxdepth 1 -type f -name '*.jar' | head -1)

          test -n "$APK" -a -f "$APK"
          test -n "$JAR" -a -f "$JAR"

          BASE_NAME="CoHero-SPD-${{ steps.upstream.outputs.tag }}"

          echo "SOURCE_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BASE_NAME=$BASE_NAME" >> "$GITHUB_ENV"
          echo "OUTPUT_APK=${BASE_NAME}.apk" >> "$GITHUB_ENV"
          echo "OUTPUT_JAR=${BASE_NAME}.jar" >> "$GITHUB_ENV"

      - name: Install Android build tools for signer
        shell: bash
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "out/$OUTPUT_APK"
          cp "$SOURCE_JAR" "out/$OUTPUT_JAR"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-APK
          path: out/${{ env.OUTPUT_APK }}.apk
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-JAR
          path: out/${{ env.OUTPUT_JAR }}.jar
          if-no-files-found: error
