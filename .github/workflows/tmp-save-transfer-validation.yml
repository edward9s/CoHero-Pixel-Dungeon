name: Temporary save transfer validation

on:
  push:
    branches:
      - save-transfer-app-name

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run save transfer compatibility tests
        run: python -m unittest scripts.test_save_transfer_compat
