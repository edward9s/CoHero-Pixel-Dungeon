name: Verify CoHero PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoHero source
        uses: actions/checkout@v4
        with:
          path: cohero

      - name: Resolve latest Shattered Pixel Dungeon release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(gh api repos/00-Evan/shattered-pixel-dungeon/releases/latest --jq '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::Unable to resolve the latest SPD release tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using SPD $TAG"

      - name: Checkout Shattered Pixel Dungeon
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ steps.upstream.outputs.tag }}
          path: spd

      - name: Verify CoHero source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python cohero/scripts/verify_source_layout.py cohero
          python cohero/scripts/verify_cohero_semantics.py cohero

      - name: Overlay CoHero source
        shell: bash
        run: |
          set -euo pipefail
          cp -a cohero/core/. spd/core/

      - name: Apply CoHero integration patches
        shell: bash
        run: |
          set -euo pipefail
          bash cohero/integration/shattered/apply.sh base spd cohero
          bash cohero/integration/shattered/apply.sh wndgame spd cohero
          bash cohero/integration/shattered/apply.sh messages spd cohero

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android debug and desktop
        working-directory: spd
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug :desktop:classes
