cohero.combo.detail.main.2=Strike one enemy hard, dealing extra damage below half health.
cohero.combo.detail.main.3=Pierce enemies along the projectile line.
cohero.combo.detail.main.4=Deal massive damage to a single enemy.
cohero.combo.detail.partner.0=Both heroes gain shields.
cohero.combo.detail.partner.1=Cause an extra explosion around the target.
cohero.combo.detail.partner.2=Make the surviving target vulnerable for 3 turns.
cohero.combo.detail.partner.3=Cripple the surviving target for 3 turns.
cohero.combo.detail.partner.4=Strike the target a second time.
cohero.combo.detail.partner.5=Heal both heroes.
cohero.combo.detail.partner.3.5=Give both heroes shields.
cohero.combo.detail.cleric.0=Give both heroes a large shield.
cohero.combo.detail.cleric.1=Blast nearby enemies, cleanse both heroes and restore health.
cohero.combo.detail.cleric.2=Make both heroes invisible for 4 turns.
cohero.combo.detail.cleric.3=Heal both heroes and fire at nearby visible enemies.
cohero.combo.detail.cleric.4=Shield and bless both heroes.
cohero.combo.detail.cleric.5=Cleanse, heal and shield both heroes.
cohero.combo.detail.extra.0.5=Weaken the target for 3 turns.
cohero.combo.detail.extra.3.0=Also make the target vulnerable for 3 turns.
cohero.combo.detail.extra.4.5=Cleanse both heroes.
