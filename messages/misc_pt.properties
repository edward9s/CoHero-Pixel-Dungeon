# Ultimate skill descriptions
cohero.combo.detail.main.0=Shatter enemies within 1 tile of the target; safely knock movable survivors away.
cohero.combo.detail.main.1=Blast enemies within 1 tile; weaken and cripple nearby enemies within 2 tiles.
cohero.combo.detail.main.2=Strike harder below half HP, blink one safe tile away when possible, and briefly vanish.
cohero.combo.detail.main.3=Pierce enemies along a wall-bounded prismatic ray and briefly blind the target.
cohero.combo.detail.main.4=Strike the target, sweep up to two nearby foes, and bless both heroes.
cohero.combo.detail.partner.0=Guard both heroes and push the surviving target back if safe.
cohero.combo.detail.partner.1=Chain magic to up to two nearby enemies through open terrain and weaken them.
cohero.combo.detail.partner.2=Expose the surviving target and briefly conceal CoHero.
cohero.combo.detail.partner.3=Fire a second prismatic ray from CoHero, hitting enemies not already pierced, and blind the target.
cohero.combo.detail.partner.4=Follow up if CoHero is close, cripple the surviving target, and bless CoHero.
cohero.combo.detail.partner.5=Cleanse and heal both; add shields when either remains below half health.
cohero.combo.detail.cleric.0=Shield and bless both heroes to hold their ground.
cohero.combo.detail.cleric.1=Blast and cripple nearby enemies while cleansing and healing both heroes.
cohero.combo.detail.cleric.2=Heal both heroes and cloak them for a safe retreat.
cohero.combo.detail.cleric.3=Heal both heroes and blind nearby enemies hit by the arrow barrage.
cohero.combo.detail.cleric.4=Shield and bless both heroes for a guarded counterattack.
cohero.combo.detail.cleric.5=Cleanse, strongly heal, and shield both heroes.
cohero.combo.detail.requirement.attack=Cost %d Link. Select a reachable enemy; both heroes must be within 6 tiles and each spends a turn.
cohero.combo.detail.requirement.support=Cost %d Link. Both heroes must be within 6 tiles and each spends a turn.
