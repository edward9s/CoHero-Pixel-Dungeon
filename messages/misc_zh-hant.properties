# Ultimate skill descriptions
cohero.combo.detail.main.0=震傷目標周圍 1 格的敵人，並將可移動的敵人擊退至安全格。
cohero.combo.detail.main.1=傷害目標周圍 1 格的敵人，並使 2 格內的敵人虛弱及遲緩。
cohero.combo.detail.main.2=重擊目標，對半血以下敵人更有效；能安全撤離時瞬移一格並短暫隱形。
cohero.combo.detail.main.3=指定敵人決定稜光射線方向，射線持續貫通其後同一直線的敵人直到被地形阻擋，並短暫致盲目標。
cohero.combo.detail.main.4=重擊目標，橫掃雙人身旁最多兩名敵人，並為雙方施加祝福。
cohero.combo.detail.partner.0=掩護雙方並提供護盾；有安全落點時額外擊退目標。
cohero.combo.detail.partner.1=魔法連鎖攻擊附近最多兩名不受牆阻擋的敵人，並使其虛弱。
cohero.combo.detail.partner.2=使存活目標易傷，CoHero 短暫隱形掩護。
cohero.combo.detail.partner.3=CoHero 從另一位置再射出一條貫通目標後方敵人的稜光射線，不重複命中同一敵人，並致盲目標。
cohero.combo.detail.partner.4=CoHero 靠近時追擊目標，令存活目標遲緩，並獲得祝福。
cohero.combo.detail.partner.5=淨化、治療雙方；治療後若有人低於半血，再為雙方施加護盾。
cohero.combo.detail.cleric.0=為雙方施加大量護盾與祝福，鞏固防線。
cohero.combo.detail.cleric.1=魔法震傷並遲緩周圍敵人，同時淨化與治療雙方。
cohero.combo.detail.cleric.2=治療雙方並施加隱形，協助安全撤退。
cohero.combo.detail.cleric.3=治療雙方，並以箭陣傷害、致盲附近可見敵人。
cohero.combo.detail.cleric.4=為雙方施加護盾與祝福，準備防禦反擊。
cohero.combo.detail.cleric.5=淨化、強力治療並保護雙方。
cohero.combo.detail.requirement.attack=消耗 %d 連攜值。需選擇可攻擊敵人，雙方距離不超過 6 格，且各消耗一回合。
cohero.combo.detail.requirement.support=消耗 %d 連攜值。雙方距離不超過 6 格，且各消耗一回合。
