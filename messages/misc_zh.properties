# Ultimate skill descriptions
cohero.combo.detail.main.0=震伤目标周围 1 格的敌人，并将可移动的敌人击退至安全格。
cohero.combo.detail.main.1=伤害目标周围 1 格的敌人，并使 2 格内的敌人虚弱及迟缓。
cohero.combo.detail.main.2=重击目标，对半血以下敌人更有效；能安全撤离时瞬移一格并短暂隐形。
cohero.combo.detail.main.3=指定敌人决定棱光射线方向，射线持续贯通其后同一直线的敌人直到被地形阻挡，并短暂致盲目标。
cohero.combo.detail.main.4=重击目标，横扫双人身旁最多两名敌人，并为双方施加祝福。
cohero.combo.detail.partner.0=掩护双方并提供护盾；有安全落点时额外击退目标。
cohero.combo.detail.partner.1=魔法连锁攻击附近最多两名不受墙阻挡的敌人，并使其虚弱。
cohero.combo.detail.partner.2=使存活目标易伤，CoHero 短暂隐形掩护。
cohero.combo.detail.partner.3=CoHero 从另一位置再射出一条贯通目标后方敌人的棱光射线，不重复命中同一敌人，并致盲目标。
cohero.combo.detail.partner.4=CoHero 靠近时追击目标，令存活目标迟缓，并获得祝福。
cohero.combo.detail.partner.5=净化、治疗双方；治疗后若有人低于半血，再为双方施加护盾。
cohero.combo.detail.cleric.0=为双方施加大量护盾与祝福，巩固防线。
cohero.combo.detail.cleric.1=魔法震伤并迟缓周围敌人，同时净化与治疗双方。
cohero.combo.detail.cleric.2=治疗双方并施加隐形，协助安全撤退。
cohero.combo.detail.cleric.3=治疗双方，并以箭阵伤害、致盲附近可见敌人。
cohero.combo.detail.cleric.4=为双方施加护盾与祝福，准备防御反击。
cohero.combo.detail.cleric.5=净化、强力治疗并保护双方。
cohero.combo.detail.requirement.attack=消耗 %d 连携值。需选择可攻击敌人，双方距离不超过 6 格，且各消耗一回合。
cohero.combo.detail.requirement.support=消耗 %d 连携值。双方距离不超过 6 格，且各消耗一回合。
