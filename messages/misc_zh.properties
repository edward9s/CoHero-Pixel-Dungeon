cohero.combo.detail.main.2=重创单一敌人；目标生命低于一半时追加伤害。
cohero.combo.detail.main.3=沿投射路线贯穿敌人。
cohero.combo.detail.main.4=对单一敌人造成大量伤害。
cohero.combo.detail.partner.0=为双方提供护盾。
