cohero.combo.detail.partner.4=对目标追加一次重击。
cohero.combo.detail.partner.5=恢复双方生命。
cohero.combo.detail.partner.3.5=为双方提供护盾。
cohero.combo.detail.cleric.0=为双方提供大量护盾。
cohero.combo.detail.cleric.1=伤害附近敌人，并净化、治疗双方。
cohero.combo.detail.cleric.2=让双方隐形 4 回合。
cohero.combo.detail.cleric.3=治疗双方，并射击附近可见敌人。
cohero.combo.detail.cleric.4=为双方提供护盾与祝福。
cohero.combo.detail.cleric.5=净化、治疗并保护双方。
